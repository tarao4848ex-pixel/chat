<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>時計</title><meta name="apple-mobile-web-app-title" content="時計"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,'Helvetica Neue',sans-serif;background:#1a1a2e;height:100dvh;overflow:hidden;user-select:none}.screen{position:absolute;top:0;left:0;width:100%;height:100dvh;display:none;flex-direction:column;align-items:center;justify-content:center}#clock-screen{background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%)}.clock-date{color:rgba(255,255,255,.45);font-size:16px;font-weight:300;letter-spacing:3px;margin-bottom:20px}.clock-time{font-size:clamp(72px,20vw,120px);font-weight:100;color:#fff;letter-spacing:-4px;line-height:1;cursor:pointer;font-variant-numeric:tabular-nums;transition:opacity .15s}.clock-time:active{opacity:.6}.clock-seconds{font-size:clamp(24px,6vw,40px);color:rgba(255,255,255,.35);font-weight:200;letter-spacing:2px;margin-top:10px}#invite-screen{background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%)}.invite-title{color:rgba(255,255,255,.55);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:28px}.invite-input{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:14px 20px;color:#fff;font-size:18px;letter-spacing:4px;text-align:center;outline:none;width:240px;font-family:inherit;text-transform:uppercase;margin-bottom:20px}.invite-input:focus{border-color:rgba(74,222,128,.5)}.invite-btn{background:linear-gradient(135deg,#4ade80,#22d3ee);border:none;border-radius:12px;padding:14px 40px;color:#000;font-size:15px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit}.invite-btn:active{transform:scale(.95);opacity:.85}.invite-error{color:#f87171;font-size:13px;margin-top:14px;height:20px;text-align:center}.invite-cancel{margin-top:28px;color:rgba(255,255,255,.25);font-size:13px;cursor:pointer;padding:10px}#pin-screen{background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%)}.pin-title{color:rgba(255,255,255,.55);font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:32px}.pin-dots{display:flex;gap:16px;margin-bottom:48px}.pin-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.25);transition:all .2s}.pin-dot.filled{background:#4ade80;border-color:#4ade80;box-shadow:0 0 12px rgba(74,222,128,.5)}.pin-dot.error{background:#f87171;border-color:#f87171;animation:shake .4s ease}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}.pin-keypad{display:grid;grid-template-columns:repeat(3,72px);gap:16px}.pin-key{width:72px;height:72px;border-radius:50%;border:none;background:rgba(255,255,255,.07);color:#fff;font-size:24px;font-weight:300;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;font-family:inherit}.pin-key:active{background:rgba(255,255,255,.18);transform:scale(.92)}.pin-key.del{font-size:18px}.pin-key.empty{background:transparent;cursor:default;pointer-events:none}.pin-cancel{margin-top:32px;color:rgba(255,255,255,.25);font-size:13px;cursor:pointer;padding:10px}#chat-screen{justify-content:flex-start;background:#0f0f1a}.chat-header{width:100%;background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.06);padding:12px 16px;padding-top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;gap:12px;flex-shrink:0}.chat-back{color:rgba(255,255,255,.45);font-size:22px;cursor:pointer;padding:4px 8px;margin-left:-8px;line-height:1}.chat-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#4ade80,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#000;flex-shrink:0}.chat-header-info{flex:1}.chat-header-name{color:#fff;font-size:16px;font-weight:600}.chat-header-status{color:#4ade80;font-size:11px;margin-top:1px}.chat-messages{flex:1;width:100%;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}.chat-messages::-webkit-scrollbar{display:none}.msg-row{display:flex;align-items:flex-end;gap:8px;animation:msgIn .22s ease}@keyframes msgIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.msg-row.mine{flex-direction:row-reverse}.msg-avatar-sm{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#a78bfa,#ec4899);flex-shrink:0;font-size:11px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}.msg-wrap{display:flex;flex-direction:column;max-width:72%}.msg-row.mine .msg-wrap{align-items:flex-end}.msg-time{font-size:10px;color:rgba(255,255,255,.22);margin-bottom:3px;white-space:nowrap}.msg-bubble{padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.45;word-break:break-word;max-width:100%}.msg-row.mine .msg-bubble{background:linear-gradient(135deg,#4ade80,#22d3ee);color:#000;border-bottom-right-radius:4px}.msg-row.theirs .msg-bubble{background:rgba(255,255,255,.09);color:#fff;border-bottom-left-radius:4px}.date-divider{text-align:center;color:rgba(255,255,255,.18);font-size:11px;letter-spacing:1px;margin:8px 0}.chat-input-area{width:100%;padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.06);display:flex;gap:10px;align-items:flex-end;flex-shrink:0}.chat-input{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:10px 16px;color:#fff;font-size:15px;outline:none;resize:none;max-height:120px;font-family:inherit;line-height:1.4}.chat-input::placeholder{color:rgba(255,255,255,.22)}.chat-input:focus{border-color:rgba(74,222,128,.35)}.send-btn{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#4ade80,#22d3ee);color:#000;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0;font-family:inherit}.send-btn:active{transform:scale(.88)}.loading-msg{text-align:center;color:rgba(255,255,255,.2);font-size:13px;padding:20px}#fade-overlay{position:fixed;inset:0;background:#1a1a2e;z-index:999;transition:opacity .35s;pointer-events:none}</style></head><body><div id="fade-overlay"></div><div id="clock-screen" class="screen"><div class="clock-date" id="clock-date"></div><div class="clock-time" id="clock-time" onclick="handleClockTap()"></div><div class="clock-seconds" id="clock-secs"></div></div><div id="invite-screen" class="screen"><div class="invite-title">天才おざわさん</div><input class="invite-input" id="invite-input" type="text" placeholder="" maxlength="10" autocomplete="off" autocorrect="off" spellcheck="false"><button class="invite-btn" onclick="checkInvite()">入力</button><div class="invite-error" id="invite-error"></div><div class="invite-cancel" onclick="showClock()">キャンセル</div></div><div id="pin-screen" class="screen"><div class="pin-title">パスコードを入力</div><div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div><div class="pin-keypad"><button class="pin-key" onclick="pinInput('1')">1</button><button class="pin-key" onclick="pinInput('2')">2</button><button class="pin-key" onclick="pinInput('3')">3</button><button class="pin-key" onclick="pinInput('4')">4</button><button class="pin-key" onclick="pinInput('5')">5</button><button class="pin-key" onclick="pinInput('6')">6</button><button class="pin-key" onclick="pinInput('7')">7</button><button class="pin-key" onclick="pinInput('8')">8</button><button class="pin-key" onclick="pinInput('9')">9</button><button class="pin-key empty"></button><button class="pin-key" onclick="pinInput('0')">0</button><button class="pin-key del" onclick="pinDel()">⌫</button></div><div class="pin-cancel" onclick="showClock()">キャンセル</div></div><div id="chat-screen" class="screen"><div class="chat-header"><div class="chat-back" onclick="showClock()">‹</div><div class="chat-avatar" id="chat-avatar">?</div><div class="chat-header-info"><div class="chat-header-name" id="chat-partner-name">チャット</div><div class="chat-header-status" id="chat-status">● 接続中...</div></div></div><div class="chat-messages" id="chat-messages"><div class="loading-msg">読み込み中...</div></div><div class="chat-input-area"><textarea class="chat-input" id="chat-input" placeholder="メッセージ..." rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea><button class="send-btn" onclick="sendMsg()">↑</button></div></div><script>const SUPABASE_URL='https://wxnbmrtwcicyvufpoadt.supabase.co';const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4bmJtcnR3Y2ljeXZ1ZnBvYWR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5NTk1MTIsImV4cCI6MjA4ODUzNTUxMn0.JPIx6JNrX_2oK5pZJbiU5C_5G7sRsNSdNZ7KsG9Mvr8';const PIN_CODE='1234';let currentUser=null,realtimeChannel=null,tapCount=0,tapTimer=null,pinEntry='',lastDateShown=null,lastMsgId=null;async function sbFetch(path,options={}){const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...options,headers:{'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json','Prefer':'return=representation',...(options.headers||{})}});if(!res.ok){const err=await res.text();throw new Error(err)}const text=await res.text();return text?JSON.parse(text):null}function updateClock(){const now=new Date();const h=String(now.getHours()).padStart(2,'0');const m=String(now.getMinutes()).padStart(2,'0');const s=String(now.getSeconds()).padStart(2,'0');const days=['日','月','火','水','木','金','土'];document.getElementById('clock-time').textContent=`${h}:${m}`;document.getElementById('clock-secs').textContent=s;document.getElementById('clock-date').textContent=`${now.getMonth()+1}月${now.getDate()}日（${days[now.getDay()]}）`}setInterval(updateClock,1000);updateClock();function handleClockTap(){tapCount++;clearTimeout(tapTimer);if(tapCount>=3){tapCount=0;const saved=localStorage.getItem('invite_code');if(saved){showPin()}else{showInvite()}return}tapTimer=setTimeout(()=>{tapCount=0},1500)}function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.style.display='none');document.getElementById(id).style.display='flex'}function showClock(){disconnectRealtime();pinEntry='';updatePinDots();showScreen('clock-screen')}function showInvite(){document.getElementById('invite-input').value='';document.getElementById('invite-error').textContent='';showScreen('invite-screen');setTimeout(()=>document.getElementById('invite-input').focus(),300)}function showPin(){pinEntry='';updatePinDots();showScreen('pin-screen')}async function checkInvite(){const code=document.getElementById('invite-input').value.trim().toUpperCase();if(!code)return;document.getElementById('invite-error').textContent='確認中...';try{const rows=await sbFetch(`sessions?invite_code=eq.${encodeURIComponent(code)}&select=*`);if(!rows||rows.length===0){document.getElementById('invite-error').textContent='コードが正しくありません';return}localStorage.setItem('invite_code',code);localStorage.setItem('user_label',rows[0].user_label);document.getElementById('invite-error').textContent='';showPin()}catch(e){document.getElementById('invite-error').textContent='エラーが発生しました'}}function pinInput(n){if(pinEntry.length>=4)return;pinEntry+=n;updatePinDots();if(pinEntry.length===4){setTimeout(()=>{if(pinEntry===PIN_CODE){const code=localStorage.getItem('invite_code');const label=localStorage.getItem('user_label');currentUser={invite_code:code,user_label:label};showChatScreen()}else{for(let i=0;i<4;i++){document.getElementById('pd'+i).classList.remove('filled');document.getElementById('pd'+i).classList.add('error')}setTimeout(()=>{for(let i=0;i<4;i++){document.getElementById('pd'+i).classList.remove('error')}pinEntry='';updatePinDots()},600)}},150)}}function pinDel(){pinEntry=pinEntry.slice(0,-1);updatePinDots()}function updatePinDots(){for(let i=0;i<4;i++){document.getElementById('pd'+i).classList.toggle('filled',i<pinEntry.length)}}async function showChatScreen(){const myLabel=currentUser.user_label;const partnerLabel=myLabel==='ユーザーA'?'ユーザーB':'ユーザーA';const partnerInitial=partnerLabel==='ユーザーA'?'A':'B';document.getElementById('chat-partner-name').textContent=partnerLabel;document.getElementById('chat-avatar').textContent=partnerInitial;showScreen('chat-screen');await loadMessages();connectRealtime()}function formatTime(iso){const d=new Date(iso);return`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}function formatDate(iso){const d=new Date(iso);const today=new Date();const days=['日','月','火','水','木','金','土'];if(d.toDateString()===today.toDateString())return'今日';return`${d.getMonth()+1}月${d.getDate()}日（${days[d.getDay()]}）`}function appendMessage(msg,animate=true){const container=document.getElementById('chat-messages');const isMine=msg.user_id===currentUser.invite_code;const dateStr=formatDate(msg.created_at);if(dateStr!==lastDateShown){lastDateShown=dateStr;const div=document.createElement('div');div.className='date-divider';div.textContent=dateStr;container.appendChild(div)}const row=document.createElement('div');row.className=`msg-row ${isMine?'mine':'theirs'}`;if(!animate)row.style.animation='none';const partnerInitial=currentUser.user_label==='ユーザーA'?'B':'A';row.innerHTML=isMine?`<div class="msg-wrap"><div class="msg-time">${formatTime(msg.created_at)}</div><div class="msg-bubble">${escHtml(msg.content)}</div></div>`:`<div class="msg-avatar-sm">${partnerInitial}</div><div class="msg-wrap"><div class="msg-time">${formatTime(msg.created_at)}</div><div class="msg-bubble">${escHtml(msg.content)}</div></div>`;container.appendChild(row);lastMsgId=msg.id;scrollToBottom()}async function loadMessages(){const container=document.getElementById('chat-messages');container.innerHTML='<div class="loading-msg">読み込み中...</div>';lastDateShown=null;lastMsgId=null;try{const msgs=await sbFetch('messages?select=*&order=created_at.asc&limit=200');container.innerHTML='';if(msgs&&msgs.length>0){msgs.forEach(m=>appendMessage(m,false))}else{container.innerHTML='<div class="loading-msg">まだメッセージはありません</div>'}}catch(e){container.innerHTML='<div class="loading-msg">読み込みエラー</div>'}}async function pollMessages(){if(!currentUser)return;try{const query=lastMsgId?`messages?select=*&order=created_at.asc&id=neq.${lastMsgId}&created_at=gt.${encodeURIComponent(new Date(Date.now()-60000).toISOString())}`:'messages?select=*&order=created_at.asc&limit=1&order=created_at.desc';const msgs=await sbFetch('messages?select=*&order=created_at.asc&created_at=gt.'+encodeURIComponent(lastPollTime.toISOString()));if(msgs&&msgs.length>0){const loading=document.querySelector('#chat-messages .loading-msg');if(loading)loading.remove();msgs.forEach(m=>{if(m.user_id!==currentUser.invite_code){appendMessage(m)}});lastPollTime=new Date()}}catch(e){}}let lastPollTime=new Date();async function sendMsg(){const input=document.getElementById('chat-input');const text=input.value.trim();if(!text)return;input.value='';input.style.height='';try{const result=await sbFetch('messages',{method:'POST',body:JSON.stringify({user_id:currentUser.invite_code,content:text})});if(result&&result[0]){appendMessage(result[0])}}catch(e){console.error('送信エラー:',e)}}function connectRealtime(){disconnectRealtime();lastPollTime=new Date();const wsUrl=SUPABASE_URL.replace('https://','wss://')+'/realtime/v1/websocket?apikey='+SUPABASE_KEY+'&vsn=1.0.0';try{const ws=new WebSocket(wsUrl);realtimeChannel=ws;let connected=false;ws.onopen=()=>{connected=true;document.getElementById('chat-status').textContent='● リアルタイム接続中';ws.send(JSON.stringify({topic:'realtime:public:messages',event:'phx_join',payload:{config:{broadcast:{self:true},postgres_changes:[{event:'INSERT',schema:'public',table:'messages'}]}},ref:'1'}))};ws.onmessage=(e)=>{try{const data=JSON.parse(e.data);if(data.event==='postgres_changes'||data.event==='INSERT'){const record=data.payload&&(data.payload.record||data.payload.data);if(record&&record.content){const loading=document.querySelector('#chat-messages .loading-msg');if(loading)loading.remove();appendMessage(record)}}if(data.event==='phx_reply'){document.getElementById('chat-status').textContent='● リアルタイム接続中'}}catch(err){}};ws.onerror=()=>{connected=false;startPolling()};ws.onclose=()=>{if(connected){connected=false;startPolling()}}}catch(e){startPolling()}}let pollInterval=null;function startPolling(){document.getElementById('chat-status').textContent='● 接続中（ポーリング）';if(pollInterval)clearInterval(pollInterval);pollInterval=setInterval(async()=>{if(!currentUser)return;try{const msgs=await sbFetch('messages?select=*&order=created_at.asc&created_at=gt.'+encodeURIComponent(lastPollTime.toISOString()));if(msgs&&msgs.length>0){const loading=document.querySelector('#chat-messages .loading-msg');if(loading)loading.remove();msgs.forEach(m=>{if(m.id!==lastMsgId){appendMessage(m)}});lastPollTime=new Date()}}catch(e){}},3000)}function disconnectRealtime(){if(realtimeChannel){try{realtimeChannel.close()}catch(e){}realtimeChannel=null}if(pollInterval){clearInterval(pollInterval);pollInterval=null}}function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}function scrollToBottom(){const c=document.getElementById('chat-messages');setTimeout(()=>{c.scrollTop=c.scrollHeight},60)}function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px'}function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg()}}const overlay=document.getElementById('fade-overlay');showScreen('clock-screen');setTimeout(()=>{overlay.style.opacity='0';setTimeout(()=>overlay.style.display='none',400)},200);</script></body></html>
